<!DOCTYPE html>
<html>
<head>
    <title>Subscribe to Crime News</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Subscribe for Daily Crime News</h1>
        <p>Enter your email to receive a PDF report every morning.</p>
        <form action="/subscribe" method="post">
            <input type="email" name="email" required placeholder="Your email address" class="input-field">
            <button type="submit" class="submit-button">Subscribe</button>
        </form>
    </div>
</body>
</html>
