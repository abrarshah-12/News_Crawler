<!DOCTYPE html>
<html>
<head>
    <title>Available Reports</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="container">
        <h1>Available Reports</h1>
        <p>Here are the daily crime news reports that are available for download:</p>
        <table class="reports-table">
            <thead>
                <tr>
                    <th>Report</th>
                    <th>Date</th>
                    <th>Download</th>
                </tr>
            </thead>
            <tbody>
                {% for report in reports %}
                    <tr>
                         <td>{{ report.name }}</td>
                         <td>{{ report.date }}</td>
                         <td>
                            <a href="/download/{{ report.name }}" class="download-button">Download</a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
        <p><a href="/" class="report-link">Go back to Home Page</a></p>
    </div>
</body>
</html>
